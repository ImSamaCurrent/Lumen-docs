<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Docs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Mobile toggle -->
    <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>

    <!-- ════════ SIDEBAR ════════ -->
    <aside class="sidebar" id="sidebar">

        <!-- Logo / Site name -->
        <div class="sidebar-header">
            <a href="#" class="site-logo" id="homeLink">
                <span class="site-icon" id="siteIcon">⚡</span>
                <div>
                    <div class="site-name" id="siteName">FiveM Docs</div>
                    <div class="site-tagline" id="siteTagline">Documentation</div>
                </div>
            </a>
            <div class="site-version" id="siteVersion"></div>
        </div>

        <!-- Search -->
        <div class="sidebar-search">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 20 20" fill="none">
                    <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Rechercher...">
                <kbd class="search-shortcut">⌘K</kbd>
            </div>
        </div>

        <!-- Navigation tree -->
        <nav class="sidebar-nav" id="sidebarNav">
            <!-- Generated by JS -->
        </nav>

        <!-- Footer links -->
        <div class="sidebar-footer" id="sidebarFooter">
            <!-- Generated by JS -->
        </div>

    </aside>

    <!-- ════════ MAIN ════════ -->
    <main class="main" id="main">
        <div class="main-inner">

            <!-- Content -->
            <article class="content" id="content">
                <!-- Generated by JS -->
            </article>

            <!-- Table of contents -->
            <aside class="toc" id="toc">
                <div class="toc-title">Sur cette page</div>
                <nav class="toc-nav" id="tocNav"></nav>
            </aside>

        </div>
    </main>

    <!-- Search overlay -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-modal">
            <div class="search-modal-header">
                <svg viewBox="0 0 20 20" fill="none" width="18" height="18">
                    <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" id="searchModalInput" placeholder="Rechercher dans la documentation..." autofocus>
                <kbd class="search-esc">ESC</kbd>
            </div>
            <div class="search-modal-results" id="searchModalResults"></div>
        </div>
    </div>

    <!-- Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
